[package]
name = "asdf-cli"
description = "Command-line tool for inspecting ASDF files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "asdf"
path = "src/main.rs"
# The binary shares its name with the `asdf` library, so rustdoc would
# write both to `doc/asdf/`. A `main.rs` has no public API to publish.
doc = false

[dependencies]
asdf-core.workspace = true

[lints]
workspace = true
