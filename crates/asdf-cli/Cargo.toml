[package]
name = "asdf-cli"
description = "Command-line tool for inspecting ASDF files"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
# Not `asdf`, which upstream's own tool is called: that name is the `libasdf-rs`
# C library's too, and on Windows a binary and a C library of the same name
# both write `deps/asdf.pdb` -- so a parallel build races, and one link fails.
# It is also the asdf version manager's command. Python asdf's is `asdftool`.
name = "asdftool"
path = "src/main.rs"
# A `main.rs` has no public API to publish.
doc = false

[dependencies]
asdf-core.workspace = true

[lints]
workspace = true
