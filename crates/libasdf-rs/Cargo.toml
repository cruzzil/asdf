[package]
name = "libasdf-rs"
description = "Drop-in C ABI replacement for libasdf, implemented in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate ships the vendored upstream headers under `include/`, which stay on
# their own BSD-3-Clause terms; everything written here is MIT.
license = "MIT AND BSD-3-Clause"
repository.workspace = true
authors.workspace = true
links = "asdf"
build = "build.rs"

[lib]
# The target name decides the artifact names: `libasdf.so` and `libasdf.a`,
# which is what a consumer of libasdf links against.
#
# The idiomatic `asdf` crate's lib target has the same name, so cargo warns
# that both uplift to `target/<profile>/libasdf.rlib`. That copy is a
# convenience only -- a dependent links the hashed artifact under `deps/`,
# which is per-crate -- so the collision affects nothing that is built.
# Renaming either would change a published crate's name to silence a
# warning about a file nothing reads.
name = "asdf"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
asdf-core.workspace = true
libc.workspace = true
half.workspace = true

[build-dependencies]
cc = "1"

[lints]
workspace = true
