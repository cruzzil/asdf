name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Struct layouts involve struct tm, off_t and size_t, and the
        # _Float16 ABI differs by architecture, so a single-platform green
        # build would prove little.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the ASDF Standard
        uses: actions/checkout@v4
        with:
          repository: asdf-format/asdf-standard
          path: corpora/asdf-standard

      - name: Check out libasdf
        uses: actions/checkout@v4
        with:
          repository: asdf-format/libasdf
          path: corpora/libasdf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        env:
          ASDF_STANDARD_DIR: ${{ github.workspace }}/corpora/asdf-standard
          LIBASDF_DIR: ${{ github.workspace }}/corpora/libasdf
        run: cargo test --workspace

      # The ABI gates need the shared library present, which `cargo test`
      # alone does not guarantee for a cdylib.
      - name: ABI conformance
        env:
          ASDF_STANDARD_DIR: ${{ github.workspace }}/corpora/asdf-standard
          LIBASDF_DIR: ${{ github.workspace }}/corpora/libasdf
        run: |
          cargo build -p libasdf-rs
          cargo test -p libasdf-rs --test abi -- --nocapture

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Documentation
        run: cargo doc --workspace --no-deps
