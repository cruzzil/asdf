name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Struct layouts involve struct tm, off_t and size_t, and the
        # _Float16 ABI differs by architecture, so a single-platform green
        # build would prove little.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the ASDF Standard
        uses: actions/checkout@v4
        with:
          repository: asdf-format/asdf-standard
          path: corpora/asdf-standard

      # `submodules: true` brings in tests/munit, which upstream's own C
      # test suite needs; without it the `upstream_suite` gate skips.
      - name: Check out libasdf
        uses: actions/checkout@v4
        with:
          repository: asdf-format/libasdf
          path: corpora/libasdf
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Differential tests compare against the reference implementation.
      # They skip with a note when it is absent, so this is not required for
      # the suite to pass -- but it is the strongest evidence available.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python asdf
        run: |
          python -m venv /tmp/asdf-venv
          /tmp/asdf-venv/bin/pip install --quiet asdf lz4

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        env:
          ASDF_STANDARD_DIR: ${{ github.workspace }}/corpora/asdf-standard
          LIBASDF_DIR: ${{ github.workspace }}/corpora/libasdf
        run: cargo test --workspace

      # The C gates load the shared library, so they build it first. The
      # tests do that themselves, but running them separately reports their
      # counts in the log rather than burying them in the workspace run.
      - name: ABI conformance
        env:
          ASDF_STANDARD_DIR: ${{ github.workspace }}/corpora/asdf-standard
          LIBASDF_DIR: ${{ github.workspace }}/corpora/libasdf
        run: |
          cargo build -p libasdf-rs
          cargo test -p libasdf-rs --test abi -- --nocapture

      # Upstream's own C test suite, compiled against the vendored headers
      # and linked against our shared library. Its pass count is pinned in
      # the test, so a regression fails here.
      - name: Upstream C test suite
        env:
          ASDF_STANDARD_DIR: ${{ github.workspace }}/corpora/asdf-standard
          LIBASDF_DIR: ${{ github.workspace }}/corpora/libasdf
        run: cargo test -p libasdf-rs --test upstream_suite -- --nocapture

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Documentation
        run: cargo doc --workspace --no-deps
